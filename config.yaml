# -*- coding: utf-8 -*-
# face-match-tool 配置文件
# ---------------------------------------------------------------------------
# 这是工具的唯一权威配置来源。改完保存后：
#   - 网页界面：点「识别参数」卡片里的「重新载入」按钮即可同步，不必重启服务
#   - 命令行  ：下次运行时自动生效
# 注意：naming 里的花括号是字符串模板，必须用引号包起来，否则 YAML 会当成字典。
# ---------------------------------------------------------------------------

paths:
  reference_dir: ""   # 参考样本目录：放目标孩子清晰照片/视频的文件夹
  source_dir: ""      # 待检索目录：要全量筛查的照片/视频
  output_dir: ""      # 输出根目录（建议与 source_dir 同一磁盘分区，才能用硬链接省空间）
  # ffprobe_path: ""  # 可选。留空则自动查找：先找 _vendor/ 下的便携版，再找系统 PATH。
                      # 只有 ffprobe 装在别处、又不想加进 PATH 时才需要填。
                      # 没有 ffprobe 时视频拍摄时间会自动降级为文件修改时间，不影响运行。

model:
  name: buffalo_l            # 模型包：RetinaFace 检测 + ArcFace(R50) 特征提取，精度/速度平衡最好
  det_size: [640, 640]       # 检测输入尺寸。想提速改 [320,320]（约快 4 倍，但小脸容易漏）；
                             # 合照里孩子脸很小而召回不足时改 [768,768]（更慢但更全）
  providers: ["CPUExecutionProvider"]
                             # 推理后端。本机无 NVIDIA 显卡，只能走 CPU。
                             # 若将来有 CUDA 环境，可改 ["CUDAExecutionProvider","CPUExecutionProvider"]
  ctx_id: -1                 # -1 = 用 CPU；改用 GPU 时设为 0
  intra_op_num_threads: 2    # 【重要】单个进程内的推理线程上限。0 表示不限。
                             # 本机 12 逻辑核，实测（40 张图样本）：
                             #   6 进程 + 不限线程 → 2.56 张/秒
                             #   6 进程 + 2 线程   → 4.00 张/秒（+56%）
                             #   3 进程 + 2 线程   → 5.92 张/秒（+131%，本机最优）
                             # 原因：onnxruntime 默认给每个进程开满核心数的线程，
                             # 6 个进程就是 72 条线程抢 12 个核，互相挤占反而更慢。
                             # 经验值：进程数 × 本项 ≈ CPU 逻辑核数
  inter_op_num_threads: 1    # 算子间并行线程数，CPU 推理保持 1 即可

reference:
  # 以下门槛决定「哪些参考样本有资格参与构建孩子模板」。
  # 门槛太松，模糊/侧脸样本会把模板带偏；太严则可能一个样本都不剩而报错。
  min_det_score: 0.60        # 人脸检测置信度下限，低于此值认为不是可靠人脸
  min_face_px: 80            # 人脸框短边像素下限，过滤远景小脸。
                             # 参考样本多为全身照可降到 60；只要大头照可提到 120
  max_abs_yaw: 35            # 左右侧脸角度上限（度）。正脸为 0，90 度为完全侧脸
  max_abs_pitch: 35          # 上下俯仰角度上限（度）。低头或抬头过大会影响特征质量
  reject_outliers: true      # 自动剔除与多数样本差异过大的离群样本，防止模板被单张异常照片带偏
  video_frame_interval_ms: 1000
                             # 参考样本里的视频按多少毫秒抽一帧。参考样本建议密一些（1000 或 500），
                             # 因为样本质量直接决定模板好坏，这一步上多花时间是值得的

scan:
  # 文件名包含以下关键词的跳过不扫。这是为微信/相册类目录准备的：
  # 这类目录里 xxx_thumb.jpg 与 xxx.jpg 往往并存，缩略图占绝大多数文件数，
  # 但分辨率只有 200~400px，人脸检出率极低，扫了基本是浪费。
  # 实测：224x398 缩略图检出率 8%，原图 48%（平均人脸框 68px vs 337px）。
  # 多个关键词用逗号分隔；留空数组 [] 即关闭过滤。
  # 注：工具只认图片和视频扩展名，微信目录里的 .dat/.cache 之类不会被扫描，无需在此排除。
  exclude_patterns: ["_thumb"]

  video:
    enabled: true            # 是否扫描视频。只处理图片时设为 false
    frame_interval_ms: 500   # 视频抽帧间隔（毫秒）。数值越小越密、越不容易漏，耗时线性上升。
                             # 本机实测（120 图 + 31 视频，6 进程）：
                             #   500ms → 259 秒，达标 38 个
                             #   100ms → 976 秒（3.77 倍耗时），达标 40 个（仅多 2 个）
                             # 结论：婴幼儿视频用 500~1000 最划算，低于 500 性价比很差
    max_frames_per_video: 3000
                             # 单个视频最多抽多少帧的安全上限，防止超长视频或时间戳异常时失控
    aggregate: max           # 视频整体分数怎么定：
                             #   max       = 取所有帧里的最高分（召回高，但可能被某一帧的误检抬高）
                             #   top3_mean = 取前三高帧的均值（更稳，推荐用于误报多的场景）
    min_hit_frames: 1        # 至少几帧达标才算这个视频命中。
                             # 误报多时可设为 2，要求多次命中才认可

  # 图片与视频配对处理（最大的一处提速来源）
  # 微信保存视频时会同时生成一张同名封面图（内容通常就是视频第一帧）。
  # 本目录实测：172 个视频里有 154 个存在同名配图（90%）。
  pairing:
    enabled: true            # false = 图片与视频各自独立扫描，不做任何联动
    reuse_min_score: 70      # 封面图分数达到此值时，对应视频不再抽帧，直接沿用该分数。
                             # 原理：视频聚合方式为 max，其分数必然不低于第一帧，
                             # 而封面图就是第一帧，所以这个推断只会低估、不会漏检。
                             # 本机实测：门槛 50 时 49/172 个视频复用；门槛 70 仍能复用绝大多数，
                             # 且把「复用判断失误」的风险压得更低，因此默认取 70。
                             # 想省更多时间就调低（如 30），但过低会让模糊封面图把整组带偏
    unify_score: true        # 组内分数统一取较高者，保证图片和视频落进同一个分档目录。
                             # 关闭则两者按各自分数分档，可能出现封面图 84% 在 80-90、
                             # 视频 100% 在 90-100 这种被拆开的情况

similarity:
  mapping: calibrated        # 分数口径：
                             #   calibrated = 把余弦值线性拉伸到 0~100%（推荐，十个档位才有区分度）
                             #   raw        = 直接用余弦×100，忠于算法输出，但会大量堆在低分区
  calib_low: 0.50            # 余弦低于此值 → 记 0%
  calib_high: 0.90           # 余弦高于此值 → 记 100%
  # ---------------------------------------------------------------------------
  # 换算公式：score = (cos - calib_low) / (calib_high - calib_low) × 100
  #
  # 这两个值是整套参数里最关键的，只能用真实数据定，凭经验猜不准。下面 0.50 / 0.90
  # 是拿本机 329 个文件跑完后实测标定的，依据如下：
  #
  # 1) 正样本锚点：拿已生成的模板反过来给「参考样本目录」的 22 张照片打分
  #    （这些必定是目标孩子本人），余弦分布为
  #       最低 0.599 / 四分位 0.774 / 中位 0.815 / 最高 0.923
  #    → 22 个正样本里没有一个低于 0.55，最低的那个是 0.599 的糊照片。
  #
  # 2) 待整理相册的余弦分布（220 个有分数值的文件）：
  #       0.00~0.46 有一堆零散低分 → 0.47~0.53 完全是空的 → 0.54~0.91 连成一整片
  #    这个 0.47~0.53 的「空档」就是天然的分割山谷，正落在 0.50 上。
  #
  # 3) 两者互相印证：相册里 ≥0.54 那一整片，恰好覆盖正样本的分布区间（0.60~0.92），
  #    说明这一片基本都是本人；空档以下的 61 个文件是不可能匹配的东西。
  #
  # 于是：calib_low=0.50（卡在空档正中，低于它一律记 0）
  #       calib_high=0.90（高于已观测到的最高值 0.911，保证几乎不出现 100% 饱和）
  # 标定后正样本典型落在 69~85 分，不再像原来那样 99 个文件统统挤成 100%。
  #
  # 想再保守些就把 calib_low 提到 0.55；这套数据下 22 个正样本仍能全部通过。
  # ---------------------------------------------------------------------------

bins:
  width: 10                  # 分档宽度：每 10% 一个文件夹（00-10、10-20 … 90-100）
  min_score: 30              # 收录门槛：低于此分数不复制文件，只在 CSV 报告里留记录。
                             # 30 分对应余弦 0.62。依据：22 个正样本里分数最低的是 0.599
                             # （=24.8 分，一张糊照片），其余全部 ≥ 44 分，因此 30 分足够安全。
                             # 标定后 329 个文件的分布从原来的「90 个挤在 90-100」变成
                             # 60-70/70-80/80-90 各 48/39/31 个，直方图终于能看出区分度。
                             # 60 分以下（约 54 个）建议人工扫一眼再删——它们只是「模型没那么确定」，
                             # 不等于不是本人

timestamp:
  # 重命名所用时间的取值顺序，三级降级：取不到就顺位往下走。
  # 时间必须在复制之前从源文件读取，一旦复制完成，Windows 会把创建时间刷成当前时间。
  prefer_sources:
    image: [exif, mtime, birthtime]
                             # 图片：优先 EXIF 里的拍摄时间（最准）
    video: [meta, mtime, birthtime]
                             # 视频：优先容器元数据 creation_time（需要 ffprobe，否则自动跳过）
  fallback: unknown          # 三级都取不到时，文件名里用什么占位文字
  min_valid_year: 1975       # 早于此年份的时间视为无效（常见于相机未设日期），会继续降级

archive:
  mode: link                 # link = 硬链接优先（几乎不占额外空间，秒完成）
                             # copy = 真实复制（可拷到其他设备，但占双份空间）
  link_fallback_copy: true   # 跨磁盘分区无法硬链接时，自动回退为复制而不是报错中断
  naming: "{date}_{time}__s{score}__{stem}{ext}"
                             # 输出文件名模板。可用占位符：
                             #   {date} 日期如 20240501 | {time} 时间如 142530
                             #   {score} 相似度分数    | {bin} 分档标签如 90-100
                             #   {stem} 原文件名（不含扩展名） | {ext} 扩展名（含点）
                             # 例：{bin}/{date}_{time}{ext} 会按分档和时间命名

runtime:
  workers: 3                 # 并行进程数。这项不是越大越好，本机 12 逻辑核实测：
                             #   进程数 1 / 2 / 3 / 4 / 6 / 8 → 4.00 / 5.48 / 5.92 / 5.80 / 5.12 / 4.36 张每秒
                             # 峰值在 3 个进程（每进程 2 线程），超过反而变差；
                             # 不限线程时更极端：6 进程 2.56 张/秒，比单进程还慢 31%。
                             # 所以默认取 3，并与 model.intra_op_num_threads 配套调整
  log_level: INFO            # 日志级别：DEBUG / INFO / WARNING / ERROR
